<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta property="og:title" content="Akunaté® · Su semana 3">
<meta property="og:description" content="Mejillas firmes, labios sellados y noches más tranquilas.">
<meta property="og:image" content="https://portal.akunate.com/assets/og.png">
<meta property="og:type" content="website">
<link rel="icon" href="/assets/icon.png">
<link rel="apple-touch-icon" href="/assets/icon.png">
<title>Akunaté® · Semana 3</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Newsreader:opsz,wght@6..72,500;6..72,600&display=swap">
<style>
/* Layout: una columna de teléfono; vista general con la ruta de la semana, luego un paso a la vez con barra de avance arriba. */
:root{
  --bg:#f5f7fa; --surface:#ffffff; --ink:#16324f; --muted:#5b6b7d; --line:#dbe2ea;
  --accent:#1b3a5c; --accent-soft:#e6edf5; --brand2:#c96a3b; --done:#2f7d4f; --done-soft:#e3f2e8; --warn:#9a5b12; --warn-soft:#fbefdc;
  --display:"Newsreader", Georgia, "Times New Roman", serif;
  --body:"Atkinson Hyperlegible", system-ui, -apple-system, "Segoe UI", sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0e1620; --surface:#16212e; --ink:#e7edf4; --muted:#9fb0c2; --line:#2a394a;
  --accent:#8fb4dc; --accent-soft:#1d2c3d; --brand2:#e48f62; --done:#7fd19c; --done-soft:#1c3326; --warn:#f0b866; --warn-soft:#3a2d18; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0e1620; --surface:#16212e; --ink:#e7edf4; --muted:#9fb0c2; --line:#2a394a;
  --accent:#8fb4dc; --accent-soft:#1d2c3d; --brand2:#e48f62; --done:#7fd19c; --done-soft:#1c3326; --warn:#f0b866; --warn-soft:#3a2d18; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:18px;line-height:1.55;margin:0}
.wrap{max-width:560px;margin:0 auto;padding-inline:18px;padding-block:20px 48px;display:flex;flex-direction:column;gap:18px}
h1,h2{font-family:var(--display);font-weight:600;line-height:1.15;text-wrap:balance;margin:0}
h1{font-size:1.9rem} h2{font-size:1.5rem}
.eyebrow{font-size:.8rem;letter-spacing:.08em;text-transform:uppercase;color:var(--brand2);font-weight:700}
.brand{display:flex;align-items:center;gap:10px}.brand img{width:44px;height:44px;border-radius:50%;background:#fff;object-fit:contain}.brand span{font-family:var(--display);font-size:1.2rem;font-weight:600}
.muted{color:var(--muted)}
p{margin:0}
.progress{position:sticky;top:env(safe-area-inset-top,0px);z-index:2;background:var(--bg);padding-block:10px;display:flex;flex-direction:column;gap:6px}
.bars{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.bar{height:8px;border-radius:4px;background:var(--line)}
.bar.on{background:var(--accent)} .bar.ok{background:var(--done)}
.small{font-size:.85rem}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:18px;display:flex;flex-direction:column;gap:12px}
.route{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:10px}
.route button{all:unset;cursor:pointer;display:grid;grid-template-columns:40px 1fr auto;gap:12px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px;width:100%;box-sizing:border-box}
.route button:focus-visible,.btn:focus-visible,.opt input:focus-visible+span{outline:3px solid var(--accent);outline-offset:2px}
.num{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;background:var(--accent-soft);color:var(--accent);font-weight:700}
.num.ok{background:var(--done-soft);color:var(--done)}
.route .t{font-weight:700} .route .s{font-size:.85rem;color:var(--muted)}
.chip{font-size:.8rem;font-weight:700;border-radius:999px;padding:3px 10px;background:var(--accent-soft);color:var(--accent);white-space:nowrap}
.chip.ok{background:var(--done-soft);color:var(--done)}
ol.how{margin:0;padding-left:1.3em;display:flex;flex-direction:column;gap:8px}
.dose{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.dose div{background:var(--accent-soft);border-radius:10px;padding:10px 12px}
.dose b{display:block;font-size:.8rem;text-transform:uppercase;letter-spacing:.06em;color:var(--accent)}
.signal{border-left:4px solid var(--done);padding-left:12px} .avoid{border-left:4px solid var(--warn);padding-left:12px}
.video{border:2px dashed var(--line);border-radius:12px;padding:14px;text-align:center;color:var(--muted);font-size:.9rem}
.video video{display:block;width:100%;max-height:70vh;border-radius:10px;background:#000;margin:0 auto}
.video:has(video){border:0;padding:0}
.video a{color:var(--accent);font-weight:700}
.btn{appearance:none;border:0;border-radius:12px;padding:15px 18px;font:inherit;font-weight:700;cursor:pointer;width:100%;text-align:center;text-decoration:none;display:block}
.btn.primary{background:var(--accent);color:var(--bg)}
.btn.ghost{background:transparent;color:var(--accent);border:2px solid var(--accent)}
.btn.done{background:var(--done-soft);color:var(--done)}
.nav{display:flex;gap:10px} .nav>*{flex:1}
.cheer{background:var(--done-soft);color:var(--done);border-radius:12px;padding:12px 14px;font-weight:700}
fieldset{border:0;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
legend{font-weight:700;margin-bottom:6px;padding:0}
.opts{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.opts.c5{grid-template-columns:repeat(5,1fr)} .opts.c3{grid-template-columns:repeat(3,1fr)}
.opt{position:relative}
.opt input{position:absolute;opacity:0;inset:0;margin:0}
.opt span{display:block;text-align:center;border:1px solid var(--line);border-radius:10px;padding:10px 4px;font-size:.9rem;background:var(--surface);cursor:pointer}
.opt input:checked+span{background:var(--accent);color:var(--bg);border-color:var(--accent);font-weight:700}
.legend{font-size:.8rem;color:var(--muted)}
textarea{font:inherit;width:100%;min-height:80px;border:1px solid var(--line);border-radius:10px;padding:10px;background:var(--surface);color:var(--ink)}
.total{font-family:var(--display);font-size:1.4rem}
table{border-collapse:collapse;width:100%;font-size:.95rem}
td,th{padding:8px 6px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
th{font-size:.8rem;text-transform:uppercase;letter-spacing:.05em;color:var(--muted)}
.foot{font-size:.85rem;color:var(--muted);text-align:center}
@media (prefers-reduced-motion:no-preference){.screen{animation:in .25s ease-out}@keyframes in{from{opacity:.4;transform:translateY(6px)}to{opacity:1;transform:none}}}
</style>

<div class="wrap">
  <div class="brand"><img src="/assets/logo.png" alt="Logo de Akunaté"><span>Akunaté®</span></div>
  <div class="progress" aria-hidden="false">
    <div class="bars" id="bars"></div>
    <div class="small muted" id="progressText">Semana 3 de 12</div>
  </div>
  <main id="app"></main>
  <p class="foot">Akunaté® · Dra. Eliana Rivera · WhatsApp oficial +57 323 620 9696</p>
</div>

<script>
const WHATSAPP = "573236209696";
const VIDEOS = { mejillas: null, labios: null, noche: "/videos/lavado-nasal.mp4" }; // enlaces por agregar

const STEPS = [
  { id:"mejillas", short:"Mejillas firmes contra el dedo", time:"3 min · 2 veces al día",
    title:"Paso 1 · Mejillas firmes contra el dedo",
    why:"Fortalece el buccinador, el músculo de la mejilla que ayuda a mantener la boca cerrada mientras duerme.",
    how:["Antes de empezar, postura del globo: coronilla arriba, hombros sueltos y lengua en el punto N.","Con las manos limpias o un guante, ponga el dedo índice por dentro de la mejilla derecha.","Con los labios juntos, empuje la mejilla hacia afuera con el dedo mientras la mejilla hace fuerza hacia adentro.","Sostenga 5 segundos y suelte. Repita con la mejilla izquierda."],
    dose:["5 por cada mejilla","Mañana y tarde"],
    signal:"Siente la mejilla firme y los labios se mantienen juntos sin esfuerzo.",
    avoid:"Arrugar el mentón, apretar los dientes o hacerlo con las manos sin lavar." },
  { id:"labios", short:"Succión de mejillas y labios sellados", time:"2 min · 2 veces al día",
    title:"Paso 2 · Succione las mejillas y selle los labios",
    why:"Activa los músculos alrededor de la boca para que el aire no entre ni salga por ella durante la noche.",
    how:["Frente al espejo, succione suavemente las dos mejillas hacia adentro.","Al mismo tiempo, presione los labios contra los dientes.","Sostenga 5 segundos y relaje.","Termine con 5 aplanamientos de lengua y una /a/ sostenida, como en las semanas anteriores."],
    dose:["5 repeticiones","Después del paso 1"],
    signal:"Los labios quedan sellados y el mentón liso.",
    avoid:"Fruncir o arrugar el mentón, o contener la respiración." },
  { id:"noche", short:"Santuario nocturno", time:"8 min · cada noche",
    title:"Paso 3 · Santuario nocturno",
    why:"Nariz despejada y mente en calma para llegar a un sueño más profundo y continuo.",
    how:["Masaje nasal de 30 segundos y lavado nasal con suero tibio, cabeza hacia adelante y diciendo \"Ahhh\".","En la cama, con la luz apagada y las manos en el abdomen, inhale por la nariz en 4 tiempos y exhale en 6. Haga 10 respiraciones.","Si su mente se activa o se despierta, nombre el pensamiento sin pelear con él: \"aquí está mi mente repasando pendientes\".","Vuelva la atención al aire fresco entrando por la nariz y a la punta de la lengua en el paladar."],
    dose:["10 respiraciones 4-6","Cada noche"],
    signal:"El abdomen sube y baja, y los hombros se quedan quietos.",
    avoid:"Pelear con los pensamientos o mirar el celular si se despierta.",
    check:[
      {k:"abdomen", q:"¿Se mueve el abdomen al respirar?", o:["Sí","Un poco","No"]},
      {k:"costillas", q:"¿Logró volver a la calma si la mente se activó?", o:["Sí","A veces","No"]},
      {k:"hombros", q:"¿Amaneció con la boca cerrada?", o:["Sí","A veces","No"]}
    ] }
];

const EPWORTH = [];

const todayKey = new Date().toISOString().slice(0,10);
let state = { screen:"home", done:{}, check:{}, ep:{}, energia:null, boca:null, ronquido:null, nota:"" };
try{ const s = JSON.parse(localStorage.getItem("aku-s3")||"null"); if(s){ state = Object.assign(state,s); if(s.day!==todayKey) state.done={}; } }catch(e){}
function save(){ try{ localStorage.setItem("aku-s3", JSON.stringify(Object.assign({},state,{day:todayKey}))); }catch(e){} }

const app = document.getElementById("app");
const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const doneCount = () => STEPS.filter(s => state.done[s.id]).length;
const epDone = () => EPWORTH.every((_,i) => state.ep[i] !== undefined);
const epTotal = () => EPWORTH.reduce((a,_,i) => a + (Number(state.ep[i])||0), 0);

function bars(){
  const order = ["home","mejillas","labios","noche","registro"];
  const idx = Math.max(0, order.indexOf(state.screen));
  document.getElementById("bars").innerHTML = order.map((k,i) => {
    const ok = (STEPS.find(s=>s.id===k) && state.done[k]) || (k==="registro" && epDone());
    return `<div class="bar ${ok?"ok":i<=idx?"on":""}"></div>`;
  }).join("");
  document.getElementById("progressText").textContent =
    state.screen==="home" ? `Semana 3 de 12 · ${doneCount()} de 3 prácticas hechas hoy` :
    state.screen==="registro" ? "Registro de la semana" :
    `Paso ${STEPS.findIndex(s=>s.id===state.screen)+1} de 3`;
}

function go(screen){ state.screen = screen; save(); render(); window.scrollTo(0,0); }

function home(){
  return `<section class="screen" style="display:flex;flex-direction:column;gap:18px">
    <div style="display:flex;flex-direction:column;gap:8px">
      <span class="eyebrow">Semana 3 · Labios sellados</span>
      <h1>Esta semana, la boca aprende a quedarse cerrada</h1>
      <p class="muted">Tres prácticas cortas, unos 10 minutos al día. Al final de la semana, un registro de 1 minuto.</p>
    </div>
    <ul class="route">
      ${STEPS.map((s,i)=>`<li><button data-go="${s.id}">
        <span class="num ${state.done[s.id]?"ok":""}">${state.done[s.id]?"✓":i+1}</span>
        <span><span class="t">${esc(s.short)}</span><br><span class="s">${esc(s.time)}</span></span>
        <span class="chip ${state.done[s.id]?"ok":""}">${state.done[s.id]?"Hecho hoy":"Ver"}</span>
      </button></li>`).join("")}
      <li><button data-go="registro">
        <span class="num ${epDone()?"ok":""}">${epDone()?"✓":"4"}</span>
        <span><span class="t">Registro de la semana</span><br><span class="s">1 minuto · al final de la semana</span></span>
        <span class="chip ${epDone()?"ok":""}">${epDone()?"Listo":"Ver"}</span>
      </button></li>
    </ul>
    <div class="card">
      <strong>Su plan diario</strong>
      <div style="overflow-x:auto"><table>
        <tr><th>Momento</th><th>Qué hacer</th></tr>
        <tr><td>Mañana y tarde</td><td>Paso 1 y paso 2 frente al espejo</td></tr>
        <tr><td>Durante el día</td><td>Hidratación consciente: 2 segundos con los labios sellados antes de tragar</td></tr>
        <tr><td>Noche</td><td>Paso 3: lavado nasal y respiración en la cama</td></tr>
      </table></div>
      <p class="small muted">Día difícil: haga solo el lavado nasal y sus 10 respiraciones. Cumplir poco también cuenta.</p>
    </div>
    <button class="btn primary" data-go="${STEPS.find(s=>!state.done[s.id])?.id || "registro"}">${doneCount()===3?"Ir al registro":"Empezar"}</button>
  </section>`;
}

function step(s){
  const i = STEPS.indexOf(s), next = STEPS[i+1]?.id || "registro";
  const v = VIDEOS[s.id];
  const vid = !v ? "Video demostrativo: la Dra. Eliana se lo envía por WhatsApp."
    : /\.mp4$/.test(v) ? `<video controls playsinline preload="none" poster="${esc(v.replace(/\.mp4$/,".jpg"))}" src="${esc(v)}"></video>`
    : `<a href="${esc(v)}" target="_blank" rel="noopener">▶ Ver el video demostrativo</a>`;
  const checks = s.check ? `<div class="card"><strong>¿Qué notó hoy?</strong>${s.check.map(c=>`
    <fieldset><legend>${esc(c.q)}</legend><div class="opts c3">${c.o.map(o=>`
      <label class="opt"><input type="radio" name="${c.k}" id="${c.k}-${o}" value="${esc(o)}" ${state.check[c.k]===o?"checked":""}><span>${esc(o)}</span></label>`).join("")}
    </div></fieldset>`).join("")}</div>` : "";
  return `<section class="screen" style="display:flex;flex-direction:column;gap:16px">
    <h2>${esc(s.title)}</h2>
    <p>${esc(s.why)}</p>
    <div class="video">${vid}</div>
    <div class="card"><strong>Cómo hacerlo</strong><ol class="how">${s.how.map(h=>`<li>${esc(h)}</li>`).join("")}</ol></div>
    <div class="dose"><div><b>Cuánto</b>${esc(s.dose[0])}</div><div><b>Cuándo</b>${esc(s.dose[1])}</div></div>
    <p class="signal"><strong>Va bien si:</strong> ${esc(s.signal)}</p>
    <p class="avoid"><strong>Evite:</strong> ${esc(s.avoid)}</p>
    ${checks}
    ${state.done[s.id] ? `<div class="cheer">¡Muy bien! Paso ${i+1} de 3 hecho hoy.</div>` : `<button class="btn primary" data-done="${s.id}">Lo hice hoy ✓</button>`}
    <div class="nav"><button class="btn ghost" data-go="home">Volver</button><button class="btn ${state.done[s.id]?"primary":"ghost"}" data-go="${next}">Siguiente</button></div>
  </section>`;
}

function registro(){
  const labels = ["Nunca","Poco","Moderado","Mucho"];
  const ready = state.energia && state.boca && state.ronquido;
  return `<section class="screen" style="display:flex;flex-direction:column;gap:16px">
    <span class="eyebrow">Registro de la semana</span>
    <h2>¿Cómo le fue esta semana?</h2>
    <p class="muted">Responda pensando en los últimos 7 días. Le toma 1 minuto.</p>
    ${EPWORTH.length?`<div class="card"><strong>¿Qué tan probable es que se quede dormido…?</strong>
      <p class="legend">0 nunca · 1 poco probable · 2 moderado · 3 muy probable</p>
      ${EPWORTH.map((q,i)=>`<fieldset><legend>${esc(q)}</legend><div class="opts">${[0,1,2,3].map(v=>`
        <label class="opt"><input type="radio" name="ep${i}" id="ep${i}-${v}" value="${v}" ${String(state.ep[i])===String(v)?"checked":""}><span>${v}<br><small>${labels[v]}</small></span></label>`).join("")}
      </div></fieldset>`).join("")}
    </div>`:""}
    <div class="card">
      <fieldset><legend>Energía al despertar</legend><div class="opts c5">${[1,2,3,4,5].map(v=>`
        <label class="opt"><input type="radio" name="energia" id="en-${v}" value="${v}" ${String(state.energia)===String(v)?"checked":""}><span>${v}</span></label>`).join("")}</div>
        <p class="legend">1 muy cansado · 5 con mucha energía</p></fieldset>
      <fieldset><legend>Boca seca al despertar</legend><div class="opts c3">${["Casi nunca","A veces","Casi siempre"].map(v=>`
        <label class="opt"><input type="radio" name="boca" id="boca-${v}" value="${v}" ${state.boca===v?"checked":""}><span>${v}</span></label>`).join("")}</div></fieldset>
      <fieldset><legend>Ronquido que lo despierta</legend><div class="opts c3">${["Menos","Igual","Más"].map(v=>`
        <label class="opt"><input type="radio" name="ronquido" id="ron-${v}" value="${v}" ${state.ronquido===v?"checked":""}><span>${v}</span></label>`).join("")}</div></fieldset>
      <label for="nota"><strong>¿Algo que quiera contarle a la Dra. Eliana?</strong></label>
      <textarea id="nota" placeholder="Opcional">${esc(state.nota)}</textarea>
    </div>
    ${EPWORTH.length && epDone() ? `<p class="total">Su puntaje de somnolencia hoy: ${epTotal()} de 24</p>` : ""}
    <a class="btn primary" id="send" href="${waLink()}" target="_blank" rel="noopener" ${ready?"":'aria-disabled="true" style="opacity:.5;pointer-events:none"'}>Enviar a la Dra. Eliana por WhatsApp</a>
    <button class="btn ghost" id="copy">Copiar mis respuestas</button>
    <p class="small muted" id="copyMsg">${ready?"":"Responda todas las preguntas para poder enviarlas."}</p>
    <div class="card"><strong>Siguiente paso</strong><p>Al recibir su registro, la Dra. Eliana le envía su semana 4.</p></div>
    <button class="btn ghost" data-go="home">Volver a la semana</button>
  </section>`;
}

function summary(){
  const yes = STEPS.filter(s=>state.done[s.id]).map(s=>s.short).join(", ") || "ninguna aún";
  return [
    "Akunaté · Semana 3 · Registro de la semana",
    EPWORTH.length ? `Somnolencia (Epworth): ${epTotal()}/24 [${EPWORTH.map((_,i)=>state.ep[i]??"-").join(",")}]` : "",
    `Energía al despertar: ${state.energia??"-"}/5`,
    `Boca seca al despertar: ${state.boca??"-"}`,
    `Ronquido que lo despierta: ${state.ronquido??"-"}`,
    `Noche: abdomen se mueve ${state.check.abdomen??"-"}, vuelve a la calma ${state.check.costillas??"-"}, amanece con boca cerrada ${state.check.hombros??"-"}`,
    `Prácticas hechas hoy: ${yes}`,
    state.nota ? `Comentario: ${state.nota}` : ""
  ].filter(Boolean).join("\n");
}
function waLink(){ return `https://wa.me/${WHATSAPP}?text=${encodeURIComponent(summary())}`; }

function render(){
  bars();
  const s = STEPS.find(x=>x.id===state.screen);
  app.innerHTML = state.screen==="home" ? home() : s ? step(s) : registro();
}

app.addEventListener("click", e => {
  const g = e.target.closest("[data-go]"); if(g){ go(g.dataset.go); return; }
  const d = e.target.closest("[data-done]"); if(d){ state.done[d.dataset.done]=true; save(); render(); return; }
  if(e.target.id==="copy"){
    const text = summary(), msg = document.getElementById("copyMsg");
    const ok = () => msg.textContent = "Copiado. Péguelo en el chat de WhatsApp de Akunaté.";
    try{ navigator.clipboard.writeText(text).then(ok, () => { msg.textContent = text; }); }catch(err){ msg.textContent = text; }
  }
});
app.addEventListener("change", e => {
  const t = e.target, n = t.name;
  if(!n) return;
  if(n.startsWith("ep")) state.ep[n.slice(2)] = t.value;
  else if(["abdomen","costillas","hombros"].includes(n)) state.check[n] = t.value;
  else state[n] = t.value;
  save();
  if(state.screen==="registro"){ const y = window.scrollY; render(); window.scrollTo(0,y); }
});
app.addEventListener("input", e => { if(e.target.id==="nota"){ state.nota = e.target.value; save(); const a=document.getElementById("send"); if(a) a.href = waLink(); } });

render();
</script>
